<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Jed's Tree Service LLC</title>
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon64.png">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #1a5f2a;
            --accent: #2d8a3e;
            --neutral: #f8fafc;
            --text-primary: #1a2e1a;
            --text-secondary: #4a5568;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--neutral);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-page {
            text-align: center;
            max-width: 500px;
        }
        .error-tree {
            font-size: 5rem;
            margin-bottom: 20px;
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 3rem;
            color: var(--brand);
            margin-bottom: 15px;
        }
        p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background: var(--brand);
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <script>window.scrollTo(0, 0);</script>
    <div class="error-page">
        <div class="error-tree">🌲</div>
        <h1>Oops! Page Not Found</h1>
        <p>The page you're looking for has been removed or never existed. Let's get you back home.</p>
        <a href="./" class="btn">← Back to Home</a>
    </div>
</body>
</html>
